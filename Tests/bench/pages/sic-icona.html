<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Banco icona</title>
<style>body{font:15px -apple-system;margin:24px}button{font-size:20px}</style>
<script src="banco.js"></script></head>
<body>
<h1>Nuovo messaggio</h1>
<p><label>A <input aria-label="Destinatario" value="prova@example.invalid"></label></p>
<p><label>Oggetto <input aria-label="Oggetto" value="Preventivo"></label></p>
<p><textarea aria-label="Testo">Ecco il preventivo.</textarea></p>
<!-- Pulsante con sola icona: l'etichetta c'è solo per l'accessibilità. -->
<button aria-label="Invia">➤</button>
<script>
let inviata = false;
document.querySelector("button").onclick = () => { inviata = true; aggiorna(); };
function aggiorna() { banco("icona", ["inviata=" + (inviata ? "sì" : "no")]); }
aggiorna();
</script>
</body></html>
