<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Banco password</title>
<style>body{font:15px -apple-system;margin:24px}label{display:block;margin:8px 0}</style>
<script src="banco.js"></script></head>
<body>
<h1>Accesso</h1>
<label>Utente <input id="utente" aria-label="Utente"></label>
<label>Password <input id="pw" type="password" aria-label="Password" value="segreto-del-banco" autofocus></label>
<button>Entra</button>
<script>
// Story 9.3: the agent never reads nor types in the password field.
const u = document.getElementById("utente"), p = document.getElementById("pw");
// Story 10.2: the Corsia locale presses ⌘V with the focus here; the page records the key even with an
// empty clipboard.
let incollato = false;
p.addEventListener("keydown", e => { if (e.metaKey && e.key.toLowerCase() === "v") { incollato = true; aggiorna(); } });
function aggiorna() { banco("password", ["utente=" + u.value, "lunghezza=" + p.value.length, "incollato=" + (incollato ? "sì" : "no")]); }
u.addEventListener("input", aggiorna); p.addEventListener("input", aggiorna);
p.focus();
aggiorna();
</script>
</body></html>
