<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Banco sito</title>
<style>body{font:15px -apple-system;margin:24px}nav a{margin-right:18px}</style>
<script src="banco.js"></script></head>
<body>
<nav><a href="#home">Home</a><a href="#chi">Chi siamo</a><a href="#prezzi">Prezzi</a><a href="#contatti">Contatti</a></nav>
<h1 id="h">Home</h1>
<p id="p">Benvenuto nel sito di prova.</p>
<script>
const pagine = {home:"Home", chi:"Chi siamo", prezzi:"Prezzi", contatti:"Contatti"};
function aggiorna() {
  const k = location.hash.slice(1) || "home";
  document.getElementById("h").textContent = pagine[k] || "Home";
  banco("sito", ["pagina: " + (pagine[k] || "Home")]);
}
window.addEventListener("hashchange", aggiorna);
aggiorna();
</script>
</body></html>
