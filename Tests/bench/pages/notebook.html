<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Banco notebook</title>
<style>body{font:15px -apple-system;margin:24px}.cell{border:1px solid #ccc;padding:8px;font-family:Menlo;white-space:pre;min-height:60px;margin-bottom:16px}</style>
<script src="banco.js"></script></head>
<body>
<h1>Quiz del corso</h1>
<p>Cella 1 (codice):</p>
<div id="cella" class="cell" contenteditable="true" aria-label="Cella di codice">titolo = "Quiz"
domanda = "Che cos'è il cloud computing?"
punti = 3</div>
<p>Risposta attesa:</p>
<textarea id="risposta" aria-label="Risposta attesa" rows="3" cols="60">Una rete di computer</textarea>
<script>
function aggiorna() {
  const c = document.getElementById("cella").innerText.replace(/\n+/g, " | ").trim();
  const r = document.getElementById("risposta").value.trim();
  banco("notebook", ["cella: " + c, "risposta=" + (r || "(vuota)")]);
}
document.getElementById("cella").addEventListener("input", aggiorna);
document.getElementById("risposta").addEventListener("input", aggiorna);
setInterval(aggiorna, 500);
aggiorna();
</script>
</body></html>
